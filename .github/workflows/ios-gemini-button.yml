name: iOS Gemini Button

on:
  push:
    paths:
      - 'ios-gemini-button/**'
      - '.github/workflows/ios-gemini-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios-gemini-button
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned IPA
        working-directory: ios-gemini-button
        run: |
          xcodebuild -project GeminiButton.xcodeproj -scheme GeminiButton \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GeminiButton.app Payload/
          zip -qry GeminiButton-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiButton-ipa
          path: ios-gemini-button/GeminiButton-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gemini-button-${{ github.run_number }}
          name: Gemini Кнопка (iOS) build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ios-gemini-button/GeminiButton-unsigned.ipa
