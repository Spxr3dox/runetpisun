name: GeminiButton
options:
  bundleIdPrefix: com.runetpisun
  deploymentTarget:
    iOS: "17.0"
targets:
  GeminiButton:
    type: application
    platform: iOS
    sources: [GeminiButton]
    scheme: {}
    info:
      path: GeminiButton/Info.plist
      properties:
        CFBundleDisplayName: Gemini Кнопка
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [googlegemini]
        CFBundleURLTypes:
          - CFBundleURLName: com.runetpisun.geminibutton
            CFBundleURLSchemes: [geminibutton]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runetpisun.geminibutton
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
